# Dogfooding CI for the plugin itself.
# This is a Node-based Claude Code plugin, so it does not use the Maven
# templates generated by /spring-boot-workflows:ci-setup.
name: Validate plugin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure & Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Validate plugin structure
        run: node tests/validate-workflows.js

      - name: Render CI templates
        run: node tests/ci-templates.test.js
