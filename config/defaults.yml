# spring-boot-workflows configuration
# Copy to .workflows/config.yml and customize for your project.
version: "3.0"

project:
  name: ""
  type: "spring-boot"    # spring-boot | java | generic
  language: "java"       # java
  team: ""                # spring | (empty)
  spring:
    boot_major: 4         # 4 | 3 — selects the Spring Boot knowledge set (see rule-04)
    build_tool: ""        # maven | gradle | (empty = auto-detect)
    persistence: ""       # jpa | jdbc | (empty = auto-detect)

git:
  branches:
    main: "main"
    development: "develop"
    feature: "feature/{name}"
    bugfix: "bugfix/{name}"
    hotfix: "hotfix/{name}"
    release: "release/v{version}"
  commits:
    format: "conventional" # conventional | angular | simple
    types: [feat, fix, refactor, test, docs, chore, style, perf]
    scopes: true
    ticket_reference: false
  pr:
    base_branch: "develop"
    draft: false
    reviewers: []
    labels: []
    template: |
      ## Summary
      {summary}

      ## Changes
      {changes}

      ## Test Plan
      {test_plan}
  merge:
    strategy: "squash"     # squash | merge | rebase
    delete_branch: true
  protected: ["main", "master", "develop"]

ci:
  platform: "auto"          # auto | github | gitea | both
  java_versions: [25]       # list, but phase 1 renders ONE JDK — the first entry
  runner: "ubuntu-latest"
  mirror: "none"            # none | aliyun | tsinghua (writes .mvn/settings.xml)
  features: [test, coverage, artifact]
  # test | coverage | coverage-gate | spotbugs | pmd | checkstyle | dependency-check | artifact
  #
  # A feature whose Maven plugin is not declared in the project's pom.xml is
  # dropped with a warning — never emitted as a step that always fails.
  # `coverage-gate` additionally requires jacoco <rules> in the pom; without it
  # `jacoco:check` passes trivially, so the block is dropped and the coverage
  # number is reported instead.
  #
  # Docker, SSH deploy, Gradle, and the JDK matrix are phase 2 — see TODO.md.

workflows:
  new-feature:
    require_spec: true
    require_tests: true
    require_brainstorm: true
    max_plan_phases: 10
    adaptive: true
  extend-feature:
    require_brainstorm: true
    require_tests: true
  hotfix:
    base_branch: ""        # empty = falls back to git.branches.main at runtime
    require_tests: true
    max_lines: 15
  refactor:
    require_brainstorm: true
    require_tests: true
    max_dependents: 50
  release:
    changelog: true
    tag_format: "v{version}"
  review:
    checklist: "auto"      # auto | none | <path>
    # Gate level — the single source of truth for the proportional quality gate.
    # Read by rule-03 and by the `review` skill; keep rule-03's table and this
    # block in sync (tests/validate-workflows.js asserts it).
    size_thresholds:
      light: { max_files: 3, max_lines: 50 }
      standard: { max_files: 15 }
    # How much context the review skill reads up front (Phase 1). Separate from
    # the gate level above — this one is about reading strategy, not severity.
    context_thresholds: { small: 10, medium: 30 }
  migrate:
    require_brainstorm: true
  test:
    default_coverage: 90
    default_type: "unit"
  brainstorm:
    default_depth: "standard"
    techniques: ["trade-off-matrix", "six-thinking-hats", "scamper", "reverse-brainstorm", "constraint-mapping"]

state:
  directory: ".workflows"
  history: true
  max_history: 50

skills:
  disabled: []
  aliases:
    build: "new-feature"
    fix: "hotfix"
    ship: "release"

chains: {}
  # new-feature: "review --self"
  # hotfix: "ci-fix --pr latest"

guards:
  enabled: false           # master switch — when true, commit/push paths run a guard scan
  strict: false            # when true, a WARN finding also blocks the operation
  config: ".workflows/guards.yml"

learning:
  enabled: true
  storage: ".workflows/learned"
  knowledge_graph: true

quality:
  self_review: true        # rule-03: the agent self-checks before reporting done
  focused_gate: true       # rule-13: apply the focused-gate weighting
  proportional: true       # rule-03: scale the gate to the change size

verify:
  # The verification loop (/verify). Every check is opt-out; a check whose
  # plugin is missing from the build file is reported SKIPPED, never PASS.
  checks: [build, static, test, coverage, security, diff]
  coverage_threshold: 80  # percent
  coverage_scope: line    # line | branch
  static_analysis: [spotbugs, pmd, checkstyle]
  static_fail_on: error   # error | warning
  dependency_scan: true   # OWASP dependency-check — slow, needs network + NVD key
  secret_scan: true
  findings_file: "findings.json"

progress:
  visual: true

telemetry:
  enabled: false           # opt-in, not opt-out
  file: ".workflows/telemetry.jsonl"
